[package]
name = "billow"
version = "0.1.34"
description = "Billow"
license = "GPL-3.0-only"
edition = "2024"
rust-version = "1.90"

[lib]
name = "billow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
age = { version = "0.12", default-features = false, features = ["armor"] }
base64 = "0.22"
brotli-decompressor = "6"
flate2 = "1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = "1"
serde_yaml = "0.9"
quick-xml = "0.42"
sha2 = "0.10"
sys-locale = "0.3"
tempfile = "3"
md-5 = "0.10"
tauri = { version = "2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
ureq = "2.12"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
ruzstd = { version = "0.8", default-features = false, features = ["std"] }
# Runs JavaScript 覆写 scripts (`function main(config)`); QuickJS keeps the binary small.
rquickjs = { version = "0.14", default-features = false, features = ["std"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Desktop global shortcuts (R39) and the notification a failed shortcut sends.
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
# One running Billow; a second launch shows it and forwards its deep link (R44).
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[target.'cfg(target_os = "android")'.dependencies]
# rquickjs ships no prebuilt Android bindings; generate them with the NDK sysroot.
rquickjs = { version = "0.14", default-features = false, features = ["std", "bindgen"] }
jni = "0.21"
ndk-context = "0.1"

[dev-dependencies]
brotli = "9"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"

# Upstream 0.9.34 reuses alias IDs when anchor names are redefined.
# Keep the parser/API unchanged and apply the scoped loader fix documented here.
[patch.crates-io]
serde_yaml = { path = "vendor/serde_yaml" }
