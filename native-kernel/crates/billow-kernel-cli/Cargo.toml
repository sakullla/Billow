[package]
name = "billow-kernel-cli"
description = "Standalone process entry for the Billow native Rust kernel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "billow-kernel"
path = "src/main.rs"

[features]
# Android packaging builds with `--features android-vpn` so the binary accepts
# `--tun-fd` and runs the VpnService data plane instead of only the mixed
# listener. Desktop builds leave it off.
android-vpn = ["billow-kernel/android-vpn"]
# Desktop builds enable the native TUN data plane (`--tun`); the desktop
# packaging script passes this feature.
desktop-tun = ["billow-kernel/desktop-tun"]

[dependencies]
anyhow.workspace = true
billow-kernel = { path = "../billow-kernel" }
clap = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["rt-multi-thread", "signal"] }
tracing.workspace = true

[dev-dependencies]
quinn.workspace = true
rand.workspace = true
russh.workspace = true
rustls.workspace = true
rustls-pemfile.workspace = true
rustls-pki-types.workspace = true
tokio = { workspace = true, features = ["full"] }

[[test]]
# `--check` on a tun-enabled configuration must validate without creating a
# device; `--tun --check` keeps that meaning too.
name = "desktop_cli"
required-features = ["desktop-tun"]
