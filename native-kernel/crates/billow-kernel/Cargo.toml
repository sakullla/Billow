[package]
name = "billow-kernel"
description = "Billow native Rust proxy kernel: embeddable engine with mixed inbound and protocol outbounds"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# `staticlib` lets the iOS Network Extension (T3/T7) link this engine without
# depending on Tauri; `rlib` is what the CLI and host code use through the
# public Rust API.
[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
aes.workspace = true
aes-gcm.workspace = true
anyhow.workspace = true
argon2.workspace = true
blake2.workspace = true
bytes.workspace = true
chacha20.workspace = true
chacha20poly1305.workspace = true
curve25519-dalek.workspace = true
ctr.workspace = true
ed25519-dalek.workspace = true
h2.workspace = true
hex.workspace = true
poly1305.workspace = true
salsa20.workspace = true
hkdf.workspace = true
hmac.workspace = true
http.workspace = true
quinn.workspace = true
quinn-proto.workspace = true
rand.workspace = true
russh.workspace = true
ring.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
rustls-pemfile.workspace = true
rustls-pki-types.workspace = true
sha1.workspace = true
sha2.workspace = true
serde.workspace = true
serde_yaml.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
tokio-rustls.workspace = true
tracing.workspace = true
typenum.workspace = true
uuid.workspace = true
x25519-dalek.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "full"] }
hex.workspace = true
rand.workspace = true
x25519-dalek.workspace = true
