[package]
name = "billow-kernel"
description = "Billow native Rust proxy kernel: embeddable engine with mixed inbound and protocol outbounds"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# `staticlib` lets the iOS Network Extension (T3/T7) link this engine without
# depending on Tauri; `rlib` is what the CLI and host code use through the
# public Rust API.
[lib]
crate-type = ["rlib", "staticlib"]

[features]
# Host-agnostic device data plane (userspace IPv4/IPv6 + TCP/UDP termination).
# It is the shared core of the iOS Packet Tunnel and the Android VpnService
# entry; enabling a device feature turns it on.
device-vpn = []
# iOS Packet Tunnel data plane plus the billow_ios_vpn_* C ABI.
ios-vpn = ["device-vpn"]
# Android VpnService data plane: the host hands over a TUN file descriptor and
# `android_vpn` pumps IP packets through it. Off for desktop builds.
android-vpn = ["device-vpn"]
# Desktop TUN data plane: the kernel creates a macOS utun / Linux /dev/net/tun /
# Windows Wintun device and carries it through the shared userspace stack.
desktop-tun = ["device-vpn"]

[dependencies]
aes.workspace = true
aes-gcm.workspace = true
anyhow.workspace = true
argon2.workspace = true
blake2.workspace = true
bytes.workspace = true
chacha20.workspace = true
chacha20poly1305.workspace = true
curve25519-dalek.workspace = true
ctr.workspace = true
ed25519-dalek.workspace = true
h2.workspace = true
hex.workspace = true
poly1305.workspace = true
salsa20.workspace = true
hkdf.workspace = true
hmac.workspace = true
libc.workspace = true
http.workspace = true
quinn.workspace = true
quinn-proto.workspace = true
rand.workspace = true
regex.workspace = true
russh.workspace = true
ruzstd.workspace = true
ring.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
rustls-pemfile.workspace = true
rustls-pki-types.workspace = true
sha1.workspace = true
sha2.workspace = true
shadowsocks.workspace = true
smoltcp.workspace = true
socket2.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
tokio-rustls.workspace = true
tracing.workspace = true
typenum.workspace = true
uuid.workspace = true
x25519-dalek.workspace = true

[[test]]
# The packet-tunnel integration test needs the data plane.
name = "ios_tunnel"
required-features = ["ios-vpn"]

[[test]]
# The shared userspace L3 stack: TCP/UDP over an in-memory IP carrier, checked
# against the kernel's independent passive TCP endpoint (`tunnel::tcp_server`).
name = "l3_stack"
required-features = ["device-vpn"]

[[test]]
# Drives the data plane through a real file descriptor (socket pair), the way
# Android's VpnService does.
name = "android_tunnel"
required-features = ["android-vpn"]

[[test]]
# Desktop TUN: configuration strictness, utun framing, route planning and the
# fd pump. A real utun creation is #[ignore]d (needs root/TunGrant).
name = "desktop_tunnel"
required-features = ["desktop-tun"]

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "full"] }
hex.workspace = true
rand.workspace = true
x25519-dalek.workspace = true
