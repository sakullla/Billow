[package]
name = "billow-kernel"
description = "Billow native Rust proxy kernel: embeddable engine for the first mixed inbound slice"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# `staticlib` lets the iOS Network Extension (T3/T7) link this engine without
# depending on Tauri; `rlib` is what the CLI and host code use through the
# public Rust API.
[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
anyhow.workspace = true
bytes.workspace = true
sha2.workspace = true
serde.workspace = true
serde_yaml.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "full"] }
