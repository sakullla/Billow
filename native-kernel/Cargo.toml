[workspace]
resolver = "2"
members = ["crates/billow-kernel", "crates/billow-kernel-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# Max crate MSRV: tokio 1.x (see Cargo.lock)
rust-version = "1.85"
license = "MIT"
publish = false

[workspace.dependencies]
aes-gcm = "0.10"
anyhow = "1"
bytes = "1"
chacha20poly1305 = "0.10"
clap = "4"
hkdf = "0.12"
rand = "0.8"

# TLS 1.2/1.3 client plus a server used only by the protocol-family tests.
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
rustls-pemfile = "2"
rustls-pki-types = "1"
sha1 = "0.10"
sha2 = "0.10"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "sync", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
