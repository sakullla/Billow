[workspace]
resolver = "2"
members = ["crates/billow-kernel", "crates/billow-kernel-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# MSRV raised to 1.89 by T11: `russh` 0.56 declares 1.85 but pulls `home`
# 0.5.12 (1.88) and the Windows-only `pageant` 0.2.5 (1.89); `uuid` 1.29.3
# already declares 1.89. The rest of the workspace compiles on 1.85, but a
# single declared MSRV must cover every dependency.
rust-version = "1.89"
license = "MIT"
publish = false

[workspace.dependencies]
aes = "0.8"
aes-gcm = "0.10"
anyhow = "1"
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
bytes = "1"
chacha20 = "0.9"
chacha20poly1305 = "0.10"
# Sudoku key material (T13): X25519 for the KIP handshake and the Edwards
# point/scalar operations `ClientAEADSeed` needs to canonicalise a hex key.
curve25519-dalek = { version = "4.1", default-features = false, features = ["alloc"] }
x25519-dalek = { version = "2.0", default-features = false, features = ["static_secrets"] }
clap = "4"
h2 = "0.4"
hkdf = "0.12"
http = "1"
hmac = "0.12"
rand = "0.8"
# QUIC transport for the hysteria/tuic/shadowquic families (T10). Default
# features are off: `platform-verifier` would add a second root-store backend
# while the kernel already builds its rustls config from the platform store and
# the configuration's extra anchors; `runtime-tokio` + `rustls-ring` is what
# the engine uses.
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
russh = { version = "0.56", default-features = false, features = ["ring"] }

# TLS 1.2/1.3 client plus a server used only by the protocol-family tests.
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
rustls-pemfile = "2"
rustls-pki-types = "1"
sha1 = "0.10"
sha2 = "0.10"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "sync", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
