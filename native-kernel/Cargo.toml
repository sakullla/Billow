[workspace]
resolver = "2"
members = ["crates/billow-kernel", "crates/billow-kernel-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# Max crate MSRV: tokio 1.x (see Cargo.lock)
rust-version = "1.85"
license = "MIT"
publish = false

[workspace.dependencies]
anyhow = "1"
bytes = "1"
clap = "4"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "sync", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
